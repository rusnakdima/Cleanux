[package]
name = "cleanux"
version = "0.2.1"
description = "System cleanup tool"
authors = ["Dmitriy303"]
edition = "2021"
repository = "https://github.com/rusnakdima/Cleanux"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "cleanux_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tauri = { version = "~2.11", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
rayon = "1.8"
walkdir = "2.4"
sha2 = "0.10"
sysinfo = "0.32"
tauri-plugin-mcp-bridge = "0.11"
tar = "0.4"
flate2 = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
dirs = "5"

nosql_orm = { git = "https://github.com/rusnakdima/nosql_orm.git", branch = "main", features = ["json", "query_cache", "validators"] }
tauri-shared = { path = "../../tauri-shared", features = ["algorithms"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("tauri"))'] }

[features]
default = []

[dev-dependencies]
tempfile = "3.10"
