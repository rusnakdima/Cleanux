<!DOCTYPE html>
<html data-app="cleanux" data-route="/settings" data-version="1.0.0">
<head>
<meta charset="UTF-8">
<title>Settings — Cleanux</title>
<style>
.bg-page { background: #0f0f10; color: #e5e7eb; font-family: system-ui, -apple-system, sans-serif; }
.card { background: #1a1a1c; border: 1px solid #2a2a2e; border-radius: 0.75rem; padding: 1rem; }
.btn { background: #3b82f6; color: white; padding: 0.5rem 1rem; border-radius: 0.375rem; border: none; cursor: pointer; font-weight: 500; }
.btn-secondary { background: #2a2a2e; color: #e5e7eb; padding: 0.5rem 1rem; border-radius: 0.375rem; border: 1px solid #3a3a3e; cursor: pointer; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
.flex { display: flex; }
.flex-col { display: flex; flex-direction: column; }
.gap-1 { gap: 0.25rem; }
.gap-2 { gap: 0.5rem; }
.gap-4 { gap: 1rem; }
.text-sm { font-size: 0.875rem; }
.text-lg { font-size: 1.125rem; }
.text-xl { font-size: 1.25rem; }
.text-2xl { font-size: 1.5rem; }
.text-3xl { font-size: 1.875rem; }
.font-bold { font-weight: 700; }
.font-medium { font-weight: 500; }
.text-muted { color: #9ca3af; }
.text-accent { color: #60a5fa; }
.text-success { color: #34d399; }
.text-warn { color: #fbbf24; }
.text-danger { color: #f87171; }
.rounded { border-radius: 0.375rem; }
.rounded-lg { border-radius: 0.5rem; }
.rounded-full { border-radius: 9999px; }
.p-2 { padding: 0.5rem; }
.p-3 { padding: 0.75rem; }
.p-4 { padding: 1rem; }
.p-6 { padding: 1.5rem; }
.m-2 { margin: 0.5rem; }
.mb-2 { margin-bottom: 0.5rem; }
.mb-4 { margin-bottom: 1rem; }
.w-full { width: 100%; }
.h-2 { height: 0.5rem; }
.bar { background: #2a2a2e; border-radius: 9999px; overflow: hidden; height: 0.5rem; }
.bar-fill { background: #3b82f6; height: 100%; }
header { padding: 1rem 1.5rem; border-bottom: 1px solid #2a2a2e; }
h1 { font-size: 1.5rem; font-weight: 700; margin: 0; }
h2 { font-size: 1.125rem; font-weight: 600; margin: 0 0 0.5rem 0; }
h3 { font-size: 1rem; font-weight: 600; margin: 0 0 0.25rem 0; }
body { margin: 0; }
.toggle { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0; cursor: pointer; }
.toggle-track { width: 2.25rem; height: 1.25rem; background: #2a2a2e; border-radius: 9999px; position: relative; }
.toggle-knob { position: absolute; top: 0.125rem; left: 0.125rem; width: 1rem; height: 1rem; background: #e5e7eb; border-radius: 9999px; transition: left 0.15s; }
.toggle.on .toggle-track { background: #3b82f6; }
.toggle.on .toggle-knob { left: 1rem; }
.select { width: 100%; padding: 0.5rem 0.75rem; background: #2a2a2e; color: #e5e7eb; border: 1px solid #3a3a3e; border-radius: 0.375rem; }
</style>
</head>
<body class="bg-page">
<div data-node-id="page-shell">
  <header data-node-id="settings-header" class="flex gap-4" style="align-items:center;">
    <div data-node-id="settings-title">
      <h1>Settings</h1>
    </div>
  </header>

  <main class="p-6 flex-col gap-4" style="display:flex; flex-direction:column;">
    <div data-node-id="appearance-card" class="card w-full">
      <h2>Appearance</h2>
      <div class="text-muted text-sm mb-2">Theme and display settings</div>
      <label class="text-muted text-sm">Theme</label>
      <select data-node-id="theme-selector" class="select" data-binding-source="settings.get" data-binding-path="theme">
        <option value="light">Light</option>
        <option value="dark" selected>Dark</option>
        <option value="system">System</option>
      </select>
    </div>

    <div data-node-id="scan-settings-card" class="card w-full">
      <h2>Scan Settings</h2>
      <div class="text-muted text-sm mb-2">Configure what to scan</div>

      <label data-node-id="scan-trash-toggle" class="toggle on" data-binding-source="settings.get" data-binding-path="scan_trash">
        <span class="toggle-track"><span class="toggle-knob"></span></span>
        <span>Include Trash</span>
      </label>
      <label data-node-id="scan-cache-toggle" class="toggle on" data-binding-source="settings.get" data-binding-path="scan_cache">
        <span class="toggle-track"><span class="toggle-knob"></span></span>
        <span>Include Cache</span>
      </label>
      <label data-node-id="scan-logs-toggle" class="toggle on" data-binding-source="settings.get" data-binding-path="scan_logs">
        <span class="toggle-track"><span class="toggle-knob"></span></span>
        <span>Include Logs</span>
      </label>
      <label data-node-id="scan-thumbnails-toggle" class="toggle on" data-binding-source="settings.get" data-binding-path="scan_thumbnails">
        <span class="toggle-track"><span class="toggle-knob"></span></span>
        <span>Include Thumbnails</span>
      </label>
    </div>

    <div data-node-id="automation-card" class="card w-full">
      <h2>Automation</h2>
      <div class="text-muted text-sm mb-2">Scheduled cleaning tasks</div>

      <label data-node-id="auto-clean-toggle" class="toggle" data-binding-source="settings.get" data-binding-path="auto_clean">
        <span class="toggle-track"><span class="toggle-knob"></span></span>
        <span>Auto-clean on startup</span>
      </label>
      <label class="text-muted text-sm">Schedule</label>
      <select data-node-id="schedule-select" class="select" data-binding-source="settings.get" data-binding-path="schedule">
        <option value="none">None</option>
        <option value="daily" selected>Daily</option>
        <option value="weekly">Weekly</option>
      </select>
    </div>

    <div data-node-id="notifications-card" class="card w-full">
      <h2>Notifications</h2>
      <div class="text-muted text-sm mb-2">Alert preferences</div>

      <label data-node-id="notify-toggle" class="toggle on" data-binding-source="settings.get" data-binding-path="notify">
        <span class="toggle-track"><span class="toggle-knob"></span></span>
        <span>Notify after cleaning</span>
      </label>
      <label data-node-id="sound-toggle" class="toggle" data-binding-source="settings.get" data-binding-path="sound">
        <span class="toggle-track"><span class="toggle-knob"></span></span>
        <span>Sound effects</span>
      </label>
    </div>
  </main>
</div>
</body>
</html>
