[package]
name = "cleanux"
version = "0.1.0"
edition = "2021"
authors = ["Dmitriy303"]

[dependencies]
# Dioxus
dioxus = { version = "0.8.0-alpha.1", features = ["desktop", "html", "hooks", "signals", "macro", "lib", "router"] }
dioxus-desktop = { version = "0.8.0-alpha.1", default-features = false, features = ["devtools", "dioxus-signals"] }
dioxus-core = "0.8.0-alpha.1"
dioxus-signals = "0.8.0-alpha.1"
dioxus-html = "0.8.0-alpha.1"
dioxus-router = "0.8.0-alpha.1"

# Shared library - pure Rust business logic
dioxus-shared = { path = "../dioxus-shared" }

# Database
nosql_orm = { git = "https://github.com/rusnakdima/nosql_orm.git", rev = "756a681f151a6388413cf6b5d66f4476d26e8321", features = ["json", "mongo", "full", "validators"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Async runtime
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
futures-util = "0.3"

# Environment
dotenvy = "0.15"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# System info
sysinfo = "0.32"
dirs = "5.0"

# Utilities
walkdir = "2.4"
rayon = "1.8"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
tar = "0.4"
flate2 = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

# MCP Server
rmcp = { version = "0.1", features = ["server"] }
tokio-tungstenite = "0.21"

# Window APIs
tao = "0.35"

# Once cell
once_cell = "1"

# Lazy static
lazy_static = "1.5"
async-trait = "0.1"
paste = "1.0"
log = "0.4"


[dev-dependencies]
tempfile = "3"

[lib]
name = "cleanux"
path = "src/lib.rs"

[[bin]]
name = "cleanux"
path = "src/main.rs"
